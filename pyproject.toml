[project]
name = "grid-up-anomaly-detection"
version = "0.1.0"
description = "Grid Up panel anomaly early-warning: anomaly detection and risk engine"
authors = [
    {name = "yusufcanzdemir", email = "yusufcan4044@gmail.com"},
    {name = "duyguabbasoglu", email = "duygua963@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "paho-mqtt (>=2.1.0,<3.0.0)",
    "pymodbus (>=3.15.0,<4.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)"
]

[project.optional-dependencies]
# FastAPI prototype in grid_up_anomaly_detection.ai.service (demo / backend integration only)
api = ["fastapi (>=0.110)", "uvicorn (>=0.27)"]

[tool.poetry]
packages = [{include = "grid_up_anomaly_detection", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
httpx = ">=0.27"      # fastapi.testclient
tabulate = ">=0.9"    # DataFrame.to_markdown in scripts/evaluate.py
ruff = ">=0.6"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
