[project]
name = "gridup-ai"
version = "0.1.0"
description = "Grid Up panel anomaly early-warning: anomaly detection and risk engine"
authors = [
    {name = "duyguabbasoglu", email = "duygua963@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy (>=1.26)",
    "pandas (>=2.1)",
    "scikit-learn (>=1.4)",
    "joblib (>=1.3)",
    "pyyaml (>=6.0)",
    "openpyxl (>=3.1)",
]

[project.optional-dependencies]
# FastAPI prototype in gridup_ai.service (demo / backend integration only)
api = ["fastapi (>=0.110)", "uvicorn (>=0.27)"]

[tool.poetry]
packages = [{include = "gridup_ai", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
httpx = ">=0.27"      # fastapi.testclient
tabulate = ">=0.9"    # DataFrame.to_markdown in scripts/evaluate.py
ruff = ">=0.6"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
